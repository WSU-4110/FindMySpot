<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindMySpot - Create Account</title>
  
  <link rel="stylesheet" href="style.css">

  <style>
    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      border-radius: inherit;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e5e7eb;
      border-top: 5px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    .loading-text {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }

    .loading-subtext {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  
  </style>
</head>
<body>
  <div class="phone" style="position: relative;">
    <div class="header">
      <div class="headerLeft">
        <div class="logoMark" aria-hidden="true"><span>🚗</span></div>
        <div class="brand">FindMy<span class="spot">Spot</span></div>
      </div>
    </div>

    <!-- SIGNUP SCREEN-->
    <div class="screen">
      <div class="authTop">
        <div style="font-size:54px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));"></div>
        <div class="appName">Create Account</div>
      </div>

      <div class="form">
        <label class="label">Full Name</label>
        <input id="suName" class="input" placeholder="Your name" type="text" />
        <label class="label">Email</label>
        <input id="suEmail" class="input" placeholder="you@example.com" type="email" />
        <label class="label">Password</label>
        <input id="suPass" class="input" placeholder="At least 6 characters" type="password" />
        <label class="label">Confirm Password</label>
        <input id="suPass2" class="input" placeholder="Confirm password" type="password" />
        <button id="btnSignup" class="btn" onclick="doSignup()">Create Account</button>
        <a href="login.html" class="btnGhost">Back to Sign In</a>
        <div id="signupMsg" class="toast hidden"></div>
      </div>

      <div class="footerNote">We don't share your information.</div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading...</div>
      <div class="loading-subtext">Creating your account</div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:3000";

    function currentUser(){ return localStorage.getItem("fms_currentUser") || ""; }
    function setCurrentUser(token){ 
      if(token) localStorage.setItem("fms_currentUser", token);
      else localStorage.removeItem("fms_currentUser");
    }
    function getUserName(){ return localStorage.getItem("fms_userName") || ""; }
    function setUserName(name){ localStorage.setItem("fms_userName", name); }

    function toast(elId, text, type){
      const el = document.getElementById(elId);
      el.textContent = text;
      el.classList.remove("hidden","ok","err");
      if(type === "ok") el.classList.add("ok");
      if(type === "err") el.classList.add("err");
    }

    function showLoading(){
      document.getElementById("loadingOverlay").classList.add("show");
    }

    function hideLoading(){
      document.getElementById("loadingOverlay").classList.remove("show");
    }


    async function doSignup(){
      const signupMsg = document.getElementById("signupMsg");
      signupMsg.classList.add("hidden");
      
      const name = (document.getElementById("suName").value || "").trim();
      const email = (document.getElementById("suEmail").value || "").trim().toLowerCase();
      const pw1 = document.getElementById("suPass").value || "";
      const pw2 = document.getElementById("suPass2").value || "";
      
      if(!name || !email || !pw1 || !pw2){
        toast("signupMsg", "Please fill in all fields.", "err");
        return;
      }
      if(pw1.length < 8){
        toast("signupMsg", "Password must be at least 8 characters.", "err");
        return;
      }
      if(pw1 !== pw2){
        toast("signupMsg", "Passwords do not match.", "err");
        return;
      }

      showLoading();

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            email: email,
            password: pw1
          })
        });

        const data = await response.json();

        if(!response.ok){
          hideLoading();
          toast("signupMsg", data.message || "Registration failed", "err");
          return;
        }

        setCurrentUser(data.token);
        setUserName(data.user.name || name);
        toast("signupMsg", "Account created! Signing you in...", "ok");
        
        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);
      } catch(error) {
        hideLoading();
        console.error("Signup error:", error);
        toast("signupMsg", "Connection error. Make sure backend is running.", "err");
      }
    }

    // Check if user is already logged in
    if(currentUser()){
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
