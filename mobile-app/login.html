<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindMySpot - Sign In</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="headerLeft">
        <div class="logoMark" aria-hidden="true"><span>🚗</span></div>
        <div class="brand">FindMy<span class="spot">Spot</span></div>
      </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="screen">
      <div class="authTop">
        <div style="font-size:54px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));"></div>
        <div class="appName">FindMySpot</div>
      </div>
      <div class="form">
        <label class="label">Email</label>
        <input id="loginEmail" class="input" placeholder="Enter your email" type="email" />
        <label class="label">Password</label>
        <input id="loginPassword" class="input" placeholder="Enter your password" type="password" />

        <div class="rowEnd">
          <button class="linkBtn" onclick="forgotPassword()">Forgot password?</button>
        </div>

        <button id="btnLogin" class="btn" onclick="doLogin()">Sign In</button>

        <div class="dividerLine"></div>

        <a href="signup.html" class="btnGhost">Create Account</a>

        <div id="loginMsg" class="toast hidden"></div>
      </div>

      <div class="footerNote">Your saved parking records are private.</div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:5000";

    function clearAndReload(){
      localStorage.removeItem("fms_currentUser");
      localStorage.removeItem("fms_userName");
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginMsg").classList.add("hidden");
      document.getElementById("loginEmail").focus();
    }

    function currentUser(){ return localStorage.getItem("fms_currentUser") || ""; }
    function setCurrentUser(token){ 
      if(token) localStorage.setItem("fms_currentUser", token);
      else localStorage.removeItem("fms_currentUser");
    }
    function getUserName(){ return localStorage.getItem("fms_userName") || ""; }
    function setUserName(name){ localStorage.setItem("fms_userName", name); }

    function toast(elId, text, type){
      const el = document.getElementById(elId);
      el.textContent = text;
      el.classList.remove("hidden","ok","err");
      if(type === "ok") el.classList.add("ok");
      if(type === "err") el.classList.add("err");
    }

    function forgotPassword(){
      toast("loginMsg", "Forgot password placeholder.\n(Connect to email reset endpoint later.)", "ok");
    }


    async function doLogin(){
      const loginMsg = document.getElementById("loginMsg");
      loginMsg.classList.add("hidden");
      
      const email = (document.getElementById("loginEmail").value || "").trim().toLowerCase();
      const pw = document.getElementById("loginPassword").value || "";
      
      if(!email || !pw){
        toast("loginMsg", "Please enter your email and password.", "err");
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: pw
          })
        });

        const data = await response.json();

        if(!response.ok){
          toast("loginMsg", data.message || "Login failed", "err");
          return;
        }

        setCurrentUser(data.data.token);
        setUserName(data.data.name);
        toast("loginMsg", "Signed in successfully! Redirecting...", "ok");
        
        setTimeout(() => {
          window.location.href = "index.html";
        }, 800);
      } catch(error) {
        console.error("Login error:", error);
        toast("loginMsg", "Connection error. Make sure backend is running.", "err");
      }
    }
  </script>
</body>
</html>
