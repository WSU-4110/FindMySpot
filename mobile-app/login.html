<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FindMySpot – Login</title>

  <style>
    :root{
      --brand-950:#062b27;
      --brand-900:#073733;
      --brand-850:#0a433e;
      --brand-800:#0d554e;
      --brand-700:#0f6a61;

      --bg1:#eef3f2;
      --bg2:#d7e3df;
      --card:#ffffff;
      --text:#0b1b1a;
      --muted:#6b7a78;
      --line: rgba(12,31,29,.12);

      --accent:#ffd84d;
      --accent-2:#ffcc2f;

      --shadow-lg: 0 18px 48px rgba(0,0,0,.16);
      --shadow-md: 0 12px 26px rgba(0,0,0,.12);
      --shadow-sm: 0 10px 18px rgba(0,0,0,.08);

      --r-outer: 24px;
      --r-card: 18px;
      --r-field: 12px;

      --ring: 0 0 0 4px rgba(255,216,77,.28);
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 520px at 18% 0%, rgba(255,216,77,.18), rgba(255,216,77,0) 55%),
        radial-gradient(900px 520px at 82% 10%, rgba(15,106,97,.16), rgba(15,106,97,0) 62%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      justify-content:center;
      padding: 26px 12px;
    }

    .phone{
      width: 390px;
      max-width: 96vw;
      border: 10px solid #1e5e59;
      border-radius: 22px;
      overflow:hidden;
      background: linear-gradient(#eaf1ef, #cfdad7);
      box-shadow: var(--shadow-lg);
      position:relative;
    }

    .header{
      background: linear-gradient(180deg, var(--brand-950), var(--brand-800));
      padding: 14px 16px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.14);
      position:relative;
      z-index: 5;
    }

    .logoMark{
      width:40px; height:40px;
      border-radius: 14px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .logoMark:before{
      content:"";
      position:absolute;
      inset:-22px;
      background: radial-gradient(circle at 30% 30%, rgba(255,216,77,.9), rgba(255,216,77,0) 55%);
      transform: rotate(10deg);
    }
    .logoMark span{
      position:relative;
      font-size:20px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
    }

    .brand{
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 22px;
      line-height: 1;
      display:flex;
      align-items:baseline;
    }
    .brand .spot{ color: #9fd6ce; }

    .screen{
      padding: 18px 16px 20px;
    }

    .titleRow{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-top: 6px;
    }
    .carIcon{
      width:36px; height:36px;
      border-radius: 14px;
      background: rgba(15,106,97,.10);
      border: 1px solid rgba(15,106,97,.12);
      display:grid;
      place-items:center;
      font-size:18px;
      box-shadow: var(--shadow-sm);
      color: #0d5a52;
      flex-shrink: 0;
    }
    .h1{
      margin:0;
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: .2px;
    }
    .sub{
      margin: 6px 0 0;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.35;
      max-width: 300px;
    }

    .form{
      margin-top: 16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: var(--r-card);
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-md);
    }

    .label{
      display:block;
      font-size: 12px;
      font-weight: 950;
      letter-spacing:.6px;
      text-transform: uppercase;
      color:#153c39;
      margin: 12px 2px 8px;
      text-align:center;
    }
    .label:first-child{ margin-top: 0; }

    .input{
      width:100%;
      padding: 12px 14px;
      border-radius: var(--r-field);
      border: 1px solid rgba(12,31,29,.14);
      background: rgba(255,255,255,.95);
      font-size: 15px;
      outline:none;
      text-align:center;
      font-weight: 800;
      letter-spacing:.35px;
      color: var(--text);
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .input::placeholder{ color:#a1aca9; font-weight:700; }
    .input:focus{
      box-shadow: var(--ring);
      border-color: rgba(255,216,77,.7);
    }

    .pw-wrap{ position: relative; }
    .pw-wrap .input{ padding-right: 42px; }
    .pw-toggle{
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }

    .forgot{
      display: block;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      margin-top: 8px;
      transition: color .15s;
    }
    .forgot:hover{ color: var(--brand-800); }

    .btn{
      margin-top: 16px;
      width:100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.08);
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      font-weight: 1000;
      letter-spacing: .8px;
      text-transform: uppercase;
      font-size: 14px;
      cursor:pointer;
      box-shadow: 0 16px 20px rgba(255,216,77,.26);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition: transform .12s ease, filter .18s ease;
      color: var(--text);
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active{ transform: translateY(0); filter: brightness(.98); }

    .divider{
      display:flex;
      align-items:center;
      gap:8px;
      margin: 16px 0 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .divider::before,.divider::after{
      content:'';
      flex:1;
      height:1px;
      background: rgba(12,31,29,.12);
    }

    .btn-social{
      width:100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(12,31,29,.14);
      background: rgba(255,255,255,.90);
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      margin-bottom: 9px;
      transition: background .15s, border-color .15s, transform .12s;
    }
    .btn-social:last-of-type{ margin-bottom: 0; }
    .btn-social:hover{
      background: #fff;
      border-color: rgba(12,31,29,.28);
      transform: translateY(-1px);
    }
    .btn-social:active{ transform: translateY(0); }

    .signup-row{
      text-align:center;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .signup-row a{
      color: var(--brand-800);
      font-weight: 900;
      text-decoration: none;
    }
    .signup-row a:hover{ text-decoration: underline; }

    .footerBar{
      margin-top: 16px;
      padding: 10px 12px;
      border-top: 1px solid rgba(0,0,0,.08);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size: 11.5px;
      color: #2a3b39;
      opacity:.92;
      flex-wrap:wrap;
    }
    .footerItem{
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .pillDot{
      width:10px;height:10px;border-radius:999px;background:rgba(20,107,97,.25);
    }
    .badge{
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(15,106,97,.10);
      border: 1px solid rgba(15,106,97,.14);
      font-weight: 900;
    }

    .toast{
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.35;
      color: #2b3b39;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(12,31,29,.12);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .toast.err{ border-color: rgba(214,69,69,.35); color:#7a1a1a; }
    .toast.ok{ border-color: rgba(18,128,96,.35); color:#0d4b3a; }
    .hidden{ display:none !important; }
  </style>
</head>

<body>
  <div class="phone">

    <div class="header">
      <div class="logoMark" aria-hidden="true"><span>🚗</span></div>
      <div class="brand">FindMy<span class="spot">Spot</span></div>
    </div>

    <div class="screen">
      <div class="titleRow">
        <div class="carIcon">🔐</div>
        <div>
          <p class="h1">WELCOME BACK</p>
          <p class="sub">Sign in to access your parking dashboard.</p>
        </div>
      </div>

      <div class="form">

        <label class="label">Email Address</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="off" />

        <label class="label">Password</label>
        <div class="pw-wrap">
          <input class="input" id="password" type="password" placeholder="••••••••" autocomplete="off" />
          <button class="pw-toggle" onclick="togglePw()" title="Show/hide password">👁</button>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button class="btn" onclick="handleLogin()">
          🔓 <span>SIGN IN</span>
        </button>

        <div id="loginMsg" class="toast hidden"></div>

        <div class="divider">or continue with</div>

        <button class="btn-social" onclick="socialLogin('Google')">
          <svg width="17" height="17" viewBox="0 0 48 48">
            <path fill="#4285F4" d="M44.5 20H24v8.5h11.7C34.1 33.1 29.6 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l6-6C34.5 6.5 29.6 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5C35.8 45.5 44.5 37 44.5 25c0-.9-.1-1.7-.2-2.5l.2-3z"/>
            <path fill="#34A853" d="M6.3 14.7l7 5.1C15.1 17 19.3 14 24 14c3 0 5.8 1.1 7.9 3l6-6C34.5 6.5 29.6 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/>
            <path fill="#FBBC05" d="M24 45.5c5.8 0 10.7-1.9 14.3-5.1l-6.6-5.4C29.6 36.8 27 37.5 24 37.5c-5.6 0-10.3-3.8-12-9l-7 5.4C8.4 41.3 15.6 45.5 24 45.5z"/>
            <path fill="#EA4335" d="M44.5 20H24v8.5h11.7c-.9 2.6-2.6 4.8-4.8 6.4l6.6 5.4C41.5 36.8 44.5 31.2 44.5 25c0-.9-.1-1.7-.2-2.5l.2-2.5z"/>
          </svg>
          Continue with Google
        </button>

        <button class="btn-social" onclick="socialLogin('Apple')">
          <svg width="17" height="17" viewBox="0 0 814 1000">
            <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 681.2 0 576.8c0-163.4 106.4-250 210.3-250 55.8 0 102.1 36.6 137.2 36.6 33 0 85.7-38.9 144.8-38.9 23.7 0 108.1 2 166.3 90.4zm-119.2-75.8c-19.1-23.8-50-40.8-79.1-40.8-5.8 0-11.7.6-17.6 1.9 0 0 26.3-95.4 99.5-152.7C712.6 22.6 770.5-.6 831.5 0c1.3 5.8 1.9 11.7 1.9 18.5-.6 72.9-31.2 149.2-77.7 197.5-44.8 46.7-98.8 84.1-166.8 49.1z"/>
          </svg>
          Continue with Apple
        </button>

        <div class="signup-row">
          New here? <a href="#">Create an account</a>
        </div>

        <div class="footerBar">
          <div class="footerItem"><span class="pillDot"></span> Need Help? <strong>(123) 4567-1010</strong></div>
          <div class="footerItem"><span class="badge">AI-Powered Security</span></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function togglePw(){
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    function showToast(text, type){
      const el = document.getElementById('loginMsg');
      el.textContent = text;
      el.className = 'toast ' + (type || '');
    }

    function handleLogin(){
      const email = document.getElementById('email').value.trim();
      const pw    = document.getElementById('password').value;

      if(!email || !pw){
        showToast('Please enter your email and password.', 'err');
        return;
      }
      if(!/\S+@\S+\.\S+/.test(email)){
        showToast('Please enter a valid email address.', 'err');
        return;
      }

      showToast('Signing in…', '');
      // Replace with your real API call:
      // fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, pw}) })
      setTimeout(() => showToast('Signed in successfully! Redirecting…', 'ok'), 1200);
    }

    function socialLogin(provider){
      showToast('Redirecting to ' + provider + '…', '');
    }
  </script>
</body>
</html>
