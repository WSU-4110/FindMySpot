
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

      --brand-900:#073733;
      --brand-850:#0a433e;
      --brand-800:#0d554e;
      --brand-700:#0f6a61;

      --bg1:#eef3f2;
      --bg2:#d7e3df;
      --card:#ffffff;
      --text:#0b1b1a;
      --muted:#6b7a78;
      --line: rgba(12,31,29,.12);

      --accent:#ffd84d;
      --accent-2:#ffcc2f;

      --shadow-lg: 0 18px 48px rgba(0,0,0,.16);
      --shadow-md: 0 12px 26px rgba(0,0,0,.12);
      --shadow-sm: 0 10px 18px rgba(0,0,0,.08);

      --r-outer: 24px;
      --r-card: 18px;
      --r-field: 12px;

      --ring: 0 0 0 4px rgba(255,216,77,.28);
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 520px at 18% 0%, rgba(255,216,77,.18), rgba(255,216,77,0) 55%),
        radial-gradient(900px 520px at 82% 10%, rgba(15,106,97,.16), rgba(15,106,97,0) 62%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      justify-content:center;
      padding: 26px 12px;
    }

    /* Phone shell (same vibe as screenshot) */
    .phone{
      width: 390px;
      max-width: 96vw;
      border: 10px solid #1e5e59;
      border-radius: 22px;
      overflow:hidden;
      background: linear-gradient(#eaf1ef, #cfdad7);
      box-shadow: var(--shadow-lg);
      position:relative;
    }

    /* Header (same layout, smoother) */
    .header{
      background: linear-gradient(180deg, var(--brand-950), var(--brand-800));
      padding: 14px 16px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.14);
      position:relative;
      z-index: 5;
    }

    .logoMark{
      width:40px; height:40px;
      border-radius: 14px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .logoMark:before{
      content:"";
      position:absolute;
      inset:-22px;
      background: radial-gradient(circle at 30% 30%, rgba(255,216,77,.9), rgba(255,216,77,0) 55%);
      transform: rotate(10deg);
    }
    .logoMark span{
      position:relative;
      font-size:20px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
    }

    .brand{
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 22px;
      line-height: 1;
      display:flex;
      align-items:baseline;
      gap:0;
    }
    .brand .spot{ color: #9fd6ce; }

    /* Tabs exactly under header (same), but less blocky */
    .tabs{
      background: rgba(255,255,255,.92);
      display:flex;
      border-bottom: 1px solid rgba(12,31,29,.10);
      backdrop-filter: blur(10px);
    }
    .tab {
      display: none;
    }
    .tab.active {
      display: block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .tab:hover{ color:#0b4a44; }
    .tab.active{
      color: #0c4a44;
    }
    .tab.active:after{
      content:"";
      position:absolute;
      left:22px;
      right:22px;
      bottom:0;
      height:3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      box-shadow: 0 6px 12px rgba(255,216,77,.25);
    }

    /* Screen content */
    .screen{
      padding: 18px 16px 12px;
      min-height: 560px;
    }
    .hidden{ display:none !important; }

    /* Titles (same structure) */
    .titleRow{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-top: 6px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffd84d, #ffcc2f);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    /* Form card (same placement as screenshot, but refined) */
    .form{
      margin-top: 16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: var(--r-card);
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-md);
    }
    .result {
      display: none;
      text-align: center;
      padding: 20px;
      background: #f0f9f8;
      border-radius: 8px;
      margin-top: 20px;
    }
    .result.show {
      display: block;
    }
    .result h3 {
      color: #0d554e;
      margin-bottom: 15px;
    }
    .stat {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      text-align: center;
    }
    .stat-box {
      flex: 1;
    }
    .stat-label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      cursor:pointer;
      box-shadow: 0 16px 20px rgba(255,216,77,.26);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition: transform .12s ease, filter .18s ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active{ transform: translateY(0); filter: brightness(.98); }
    .btn:disabled{ opacity:.65; cursor:not-allowed; transform:none; }

    /* Footer line (same content area) */
    .footerBar{
      margin-top: 16px;
      padding: 10px 12px;
      border-top: 1px solid rgba(0,0,0,.08);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size: 11.5px;
      color: #2a3b39;
      opacity:.92;
      flex-wrap:wrap;
    }
    .message.show {
      display: block;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    /* Toast messages */
    .toast{
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.35;
      color: #2b3b39;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(12,31,29,.12);
      border-radius: 14px;
      padding: 12px 12px;
      box-shadow: var(--shadow-sm);
      white-space: pre-line;
    }
    .toast.ok{ border-color: rgba(18,128,96,.35); }
    .toast.err{ border-color: rgba(214,69,69,.35); }

    /* Loading screen */
    .center{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      height: 560px;
      padding: 0 16px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0d554e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      box-shadow: var(--shadow-sm);
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
    .loadingText{
      font-size: 20px;
      font-weight: 1000;
      color: #174a45;
      letter-spacing: .2px;
    }
    .loadingSub{
      margin-top: -10px;
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Result screen (same layout: banner -> floor -> spot -> details -> map -> button) */
    .banner{
      width:100%;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color:#0c3b37;
      font-weight: 1000;
      letter-spacing:.7px;
      text-transform: uppercase;
      border-radius: 14px;
      padding: 12px 12px;
      text-align:center;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 16px 18px rgba(255,216,77,.22);
    }

    .bigStat{
      text-align:center;
      margin-top: 14px;
    }
    .bigStat .k{
      font-weight: 1000;
      letter-spacing: .9px;
      text-transform: uppercase;
      color:#1c2f2d;
      font-size: 14px;
      margin: 14px 0 6px;
    }
    .bigStat .v{
      font-weight: 1100;
      font-size: 52px;
      color:#0d4b45;
      margin:0;
      line-height: 1;
    }

    .meta{
      margin-top: 12px;
      color: #4d5e5c;
      font-size: 12.5px;
      line-height: 1.4;
      white-space: pre-line;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(12,31,29,.10);
      border-radius: 14px;
      padding: 12px 12px;
      box-shadow: var(--shadow-sm);
    }

    .map{
      margin-top: 12px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      overflow:hidden;
      background:#fff;
      box-shadow: var(--shadow-md);
    }

    .directionsBtn{
      margin-top: 12px;
      width:100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.10);
      background: linear-gradient(180deg, var(--brand-800), var(--brand-700));
      color:#fff;
      font-weight: 1000;
      font-size: 15px;
      letter-spacing: .4px;
      cursor:pointer;
      box-shadow: 0 16px 18px rgba(18,95,87,.22);
      transition: transform .12s ease, filter .18s ease;
    }
    .directionsBtn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .directionsBtn:active{ transform: translateY(0); filter: brightness(.98); }
  </style>

  <script>
    const API_BASE_URL = "http://localhost:5000";
    function normalizePlate(p){
      return (p || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    function getLocalVehicles() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LOCAL_VEHICLES_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function setLocalVehicles(items) {
      localStorage.setItem(LOCAL_VEHICLES_KEY, JSON.stringify(items));
    }

    function upsertLocalVehicle(token, plate) {
      const normalized = normalizePlate(plate);
      if (!token || !normalized) return;

      const vehicles = getLocalVehicles();
      const index = vehicles.findIndex((item) => item.token === token && normalizePlate(item.license_plate) === normalized);
      const payload = {
        id: `local-${normalized}`,
        token,
        vehicle_name: normalized,
        license_plate: normalized,
        created_at: new Date().toISOString()
      };

      if (index >= 0) {
        vehicles[index] = { ...vehicles[index], ...payload };
      } else {
        vehicles.unshift(payload);
      }

      setLocalVehicles(vehicles);
    }
