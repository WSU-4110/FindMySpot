<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindMySpot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0d554e 0%, #0f6a61 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #0d554e;
      margin-bottom: 30px;
      text-align: center;
    }
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      background: white;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s;
    }
    .tab-btn.active {
      border-color: #0d554e;
      background: #0d554e;
      color: white;
    }
    .tab-btn:hover {
      border-color: #0d554e;
    }
    .tab {
      display: none;
    }
    .tab.active {
      display: block;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }
    input:focus {
      outline: none;
      border-color: #0d554e;
      box-shadow: 0 0 0 3px rgba(13,85,78,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffd84d, #ffcc2f);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255,216,77,0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      display: none;
      text-align: center;
      padding: 20px;
      background: #f0f9f8;
      border-radius: 8px;
      margin-top: 20px;
    }
    .result.show {
      display: block;
    }
    .result h3 {
      color: #0d554e;
      margin-bottom: 15px;
    }
    .stat {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      text-align: center;
    }
    .stat-box {
      flex: 1;
    }
    .stat-label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #0d554e;
    }
    .message {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.show {
      display: block;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0d554e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 FindMySpot</h1>
    
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="find">FIND VEHICLE</button>
      <button class="tab-btn" data-tab="checkin">CHECK IN</button>
    </div>

    <div id="find" class="tab active">
      <div class="form-group">
        <label>License Plate</label>
        <input type="text" id="findPlate" placeholder="ABC-1234" autocomplete="off">
      </div>
      <button onclick="findVehicle()">🔍 FIND VEHICLE</button>
      <div id="findMsg" class="message"></div>
      
      <div id="findResult" class="result">
        <h3>✅ Vehicle Found!</h3>
        <div class="stat">
          <div class="stat-box">
            <div class="stat-label">Floor</div>
            <div class="stat-value" id="resultFloor">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Spot</div>
            <div class="stat-value" id="resultSpot">—</div>
          </div>
        </div>
        <div id="resultMeta" style="color: #666; font-size: 14px; margin: 15px 0;"></div>
      </div>

      <div id="findLoading" class="loading">
        <div class="spinner"></div>
        <p>Searching...</p>
      </div>
    </div>

    <div id="checkin" class="tab">
      <div class="form-group">
        <label>License Plate</label>
        <input type="text" id="checkPlate" placeholder="ABC-1234" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Floor</label>
        <input type="number" id="checkFloor" placeholder="2" min="1" max="5">
      </div>
      <div class="form-group">
        <label>Spot</label>
        <input type="text" id="checkSpot" placeholder="F2-S1" autocomplete="off">
      </div>
      <button onclick="checkIn()">✓ CHECK IN</button>
      <div id="checkinMsg" class="message"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:3000";
    const LOCAL_VEHICLES_KEY = "fms_savedVehicles";

    function normalizePlate(plate) {
      return String(plate || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const tabName = this.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        this.classList.add('active');
      });
    });

    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = 'message show ' + type;
    }

    function hideMessage(elementId) {
      const el = document.getElementById(elementId);
      el.className = 'message';
    }

    async function findVehicle() {
      const plate = normalizePlate(document.getElementById("findPlate").value);
      if (!plate) {
        showMessage('findMsg', '❌ Please enter a license plate', 'error');
        return;
      }

      hideMessage('findMsg');
      document.getElementById('findResult').classList.remove('show');
      document.getElementById('findLoading').classList.add('show');

      try {
        const response = await fetch(`${API_BASE_URL}/api/parking/locate/${encodeURIComponent(plate)}`);
        const data = await response.json();
        document.getElementById('findLoading').classList.remove('show');

        if (!response.ok) {
          showMessage('findMsg', `❌ ${data.message || 'Vehicle not found'}`, 'error');
          return;
        }

        const vehicleData = data.data || {};
        document.getElementById('resultFloor').textContent = vehicleData.floor || '—';
        document.getElementById('resultSpot').textContent = vehicleData.spotNumber || vehicleData.lot || '—';
        
        const parkedTime = vehicleData.parkedSince ? new Date(vehicleData.parkedSince).toLocaleString() : 'Unknown';
        document.getElementById('resultMeta').innerHTML = `<strong>${plate}</strong><br>Parked: ${parkedTime}`;

        document.getElementById('findResult').classList.add('show');
        showMessage('findMsg', '✅ Vehicle found!', 'success');
      } catch (error) {
        document.getElementById('findLoading').classList.remove('show');
        showMessage('findMsg', `❌ Connection error. Is the server running?`, 'error');
      }
    }

    async function checkIn() {
      const plate = normalizePlate(document.getElementById("checkPlate").value);
      const floor = document.getElementById("checkFloor").value;
      const spot = document.getElementById("checkSpot").value.trim();

      if (!plate || !floor || !spot) {
        showMessage('checkinMsg', '❌ Please fill all fields', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/detection/record`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            licensePlate: plate,
            floor: parseInt(floor),
            lot: spot,
            eventType: 'ENTRY',
            location: `Floor ${floor}, Spot ${spot}`,
            cameraId: 'MANUAL_ENTRY'
          })
        });

        const data = await response.json();
        if (!response.ok) {
          showMessage('checkinMsg', `❌ Error: ${data.message}`, 'error');
          return;
        }

        showMessage('checkinMsg', `✅ Checked in ${plate} at Floor ${floor}, ${spot}`, 'success');
        document.getElementById("checkPlate").value = '';
        document.getElementById("checkFloor").value = '';
        document.getElementById("checkSpot").value = '';
      } catch (error) {
        showMessage('checkinMsg', `❌ Server connection failed.`, 'error');
      }
    }
  </script>
</body>
</html>
